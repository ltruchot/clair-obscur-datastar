<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <script
      type="module"
      src="https://cdn.jsdelivr.net/gh/starfederation/datastar@1.0.0-RC.6/bundles/datastar.js"></script>

    <title>Hello World</title>
  </head>
  <body>
    <h1>Hello World</h1>

    <input data-bind:msg />

    <p data-text="$msg"></p>
    <p data-computed:_reversed_msg="$msg.split('').reverse().join('')" data-text="$_reversed_msg"></p>

    <button data-attr:disabled="$msg.length === 0" data-on:click="@post('/send-message')">send</button>

    <p id="waiting-for-response"></p>
  </body>
</html>
