<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <script
      type="module"
      src="https://cdn.jsdelivr.net/gh/starfederation/datastar@1.0.0-RC.6/bundles/datastar.js"></script>

    <script>
      async function getStars() {
        const response = await fetch('https://api.github.com/repos/starfederation/datastar');
        const data = await response.json();
        return data.stargazers_count;
      }
    </script>

    <title>Stars for Datastar</title>
  </head>
  <body>
    <h1>Stars for Datastar</h1>

    <figure data-init="getStars().then(v => $datastars = v)">
      <figcaption>Repository Statistics</figcaption>
      ⭐ <output data-text="$datastars || 'loading...'"></output>
    </figure>
  </body>
</html>
